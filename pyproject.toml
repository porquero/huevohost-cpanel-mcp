[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "huevohost-cpanel-mcp"
version = "0.1.0"
description = "Servidor MCP local para acciones permitidas sobre una cuenta cPanel"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.26,<2",
    "httpx>=0.28,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "cpanel-api==0.3.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"
